<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="31" />
    </clipPath>
  </defs>
  
  <!-- Circular White Background with Subtle Shadow Ring -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>
  
  <!-- Group clipped to the circle -->
  <g clip-path="url(#circle-clip)">
    <!-- Light Beam Cone -->
    <polygon points="16.5,41.5 47.5,41.5 51.5,65 12.5,65" fill="#E8E8E8" />
  </g>
  
  <!-- Hanging Wire -->
  <line x1="32" y1="0" x2="32" y2="19.5" stroke="#111113" stroke-width="2" stroke-linecap="square" />
  
  <!-- Socket Collar -->
  <rect x="27" y="19.5" width="10" height="5.5" fill="#FFFFFF" stroke="#111113" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Trapezoid Lampshade -->
  <polygon points="27,25 37,25 47.5,41.5 16.5,41.5" fill="#FFFFFF" stroke="#111113" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Dark Bulb under Shade -->
  <path d="M 27 41.5 A 5 5 0 0 0 37 41.5 Z" fill="#222222" />
</svg>
